name: Development tests
on:
  push:
    branches:
      - dev/agent-safety-hardening-20261109
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q dayluxe tests
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -t . -v
